name: CI

on:
  push:
    branches:
      - main
      - feature/**
      - agent/**
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  backend:
    name: Backend, MySQL, and security
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_DATABASE: shopping
          MYSQL_USER: shopping_app
          MYSQL_PASSWORD: shopping_test_password
          MYSQL_ROOT_PASSWORD: root_test_password
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping --silent"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20

    env:
      DB_HOST: 127.0.0.1
      DB_PORT: '3306'
      DB_NAME: shopping
      DB_USER: shopping_app
      MYSQL_PASSWORD: shopping_test_password
      MYSQL_INTEGRATION: '1'
      AWS_DEFAULT_REGION: us-east-1

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: |
            requirements-ci.txt
            backend/agent-api/requirements.txt
            backend/layers/requirements.txt

      - name: Install CI dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-ci.txt -r backend/layers/requirements.txt -r backend/agent-api/requirements.txt

      - name: Verify patched sqlparse
        run: |
          python -c "import sqlparse; assert sqlparse.__version__ == '0.6.0', sqlparse.__version__"
          pip check

      - name: Load MySQL schema
        run: python backend/database/apply_schema.py

      - name: Run unit and MySQL integration tests
        run: |
          python -m unittest discover -s backend/agent-service/tests -v
          python -m unittest discover -s backend/agent-api/tests -v
          python -m unittest discover -s backend/tests -v

      - name: Compile Python
        run: python -m compileall -q backend

      - name: Build structured assistant Lambda image
        run: docker build --file backend/agent-api/Dockerfile backend/agent-api

      - name: Validate SAM templates
        run: |
          sam validate --lint --template backend/auth.yaml
          sam validate --lint --template backend/database.yaml
          sam validate --lint --template backend/product-mock.yaml
          sam validate --lint --template backend/shoppingcart-service.yaml
          sam validate --lint --template backend/agent-service.yaml

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install --legacy-peer-deps --no-package-lock

      - name: Lint
        run: npm run lint

      - name: Production build
        run: npm run build

  security:
    name: Security and dependency check
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: |
            requirements-ci.txt
            backend/agent-api/requirements.txt
            backend/layers/requirements.txt

      - name: Audit Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-ci.txt -r backend/layers/requirements.txt -r backend/agent-api/requirements.txt
          pip-audit --ignore-vuln PYSEC-2026-2132 --ignore-vuln PYSEC-2026-3552

      - name: Check for committed secrets
        run: |
          PATTERNS="AKIA[A-Z0-9]{16}|password\s*=\s*['\"][^'\"]+['\"]|sk-[a-zA-Z0-9]{48}"
          if grep -rE "$PATTERNS" --include="*.py" --include="*.js" --include="*.yaml" --include="*.yml" \
            --exclude-dir=node_modules --exclude-dir=.git .; then
            echo "ERROR: Potential secret found in source code"
            exit 1
          fi
          echo "No committed secrets detected."
