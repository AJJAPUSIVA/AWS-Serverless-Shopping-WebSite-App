AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: Transactional MySQL shopping cart and checkout service

Parameters:
  UserPoolArn:
    Type: 'AWS::SSM::Parameter::Value<String>'
    Default: '/serverless-shopping-cart-demo/auth/user-pool-arn'
  AllowedOrigin:
    Type: String
  DatabaseProxyEndpoint:
    Type: 'AWS::SSM::Parameter::Value<String>'
    Default: '/serverless-shopping-cart-demo/mysql/proxy-endpoint'
  DatabaseName:
    Type: 'AWS::SSM::Parameter::Value<String>'
    Default: '/serverless-shopping-cart-demo/mysql/database-name'
  DatabaseUser:
    Type: 'AWS::SSM::Parameter::Value<String>'
    Default: '/serverless-shopping-cart-demo/mysql/database-user'
  DatabaseSecurityGroupId:
    Type: 'AWS::SSM::Parameter::Value<String>'
    Default: '/serverless-shopping-cart-demo/mysql/lambda-security-group'
  DatabaseSubnetIds:
    Type: 'AWS::SSM::Parameter::Value<List<String>>'
    Default: '/serverless-shopping-cart-demo/mysql/private-subnets'

Globals:
  Function:
    Timeout: 10
    MemorySize: 512
    Tracing: Active
    AutoPublishAlias: live
    Runtime: python3.13
    Environment:
      Variables:
        LOG_LEVEL: INFO
        ALLOWED_ORIGIN: !Ref AllowedOrigin
        POWERTOOLS_SERVICE_NAME: shopping-cart
        POWERTOOLS_METRICS_NAMESPACE: ecommerce-app
        DB_HOST: !Ref DatabaseProxyEndpoint
        DB_PORT: '3306'
        DB_NAME: !Ref DatabaseName
        DB_USER: !Ref DatabaseUser
    VpcConfig:
      SecurityGroupIds:
        - !Ref DatabaseSecurityGroupId
      SubnetIds: !Ref DatabaseSubnetIds
  Api:
    EndpointConfiguration: REGIONAL
    TracingEnabled: true
    OpenApiVersion: '3.0.1'
    Cors:
      AllowMethods: "'OPTIONS,POST,GET,PUT'"
      AllowHeaders: "'Content-Type,Authorization'"
      AllowCredentials: true
      AllowOrigin: !Sub "'${AllowedOrigin}'"

Resources:
  UtilsLayer:
    Type: AWS::Serverless::LayerVersion
    Properties:
      ContentUri: ./layers/
      CompatibleRuntimes:
        - python3.13
    Metadata:
      BuildMethod: python3.13

  CartApi:
    Type: AWS::Serverless::Api
    Properties:
      StageName: Prod
      Auth:
        DefaultAuthorizer: CognitoAuthorizer
        AddDefaultAuthorizerToCorsPreflight: false
        Authorizers:
          CognitoAuthorizer:
            UserPoolArn: !Ref UserPoolArn
            Identity:
              Header: Authorization

  ListCartFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: shopping-cart-service/
      Handler: list_cart.lambda_handler
      Layers: [!Ref UtilsLayer]
      Policies: &DatabasePolicies
        - AWSLambdaVPCAccessExecutionRole
        - Statement:
            - Effect: Allow
              Action: rds-db:connect
              Resource: !Sub arn:${AWS::Partition}:rds-db:${AWS::Region}:${AWS::AccountId}:dbuser:*/${DatabaseUser}
      Events:
        ListCart:
          Type: Api
          Properties:
            RestApiId: !Ref CartApi
            Path: /cart
            Method: get

  AddToCartFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: shopping-cart-service/
      Handler: add_to_cart.lambda_handler
      Layers: [!Ref UtilsLayer]
      Policies: *DatabasePolicies
      Events:
        AddToCart:
          Type: Api
          Properties:
            RestApiId: !Ref CartApi
            Path: /cart
            Method: post

  UpdateCartFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: shopping-cart-service/
      Handler: update_cart.lambda_handler
      Layers: [!Ref UtilsLayer]
      Policies: *DatabasePolicies
      Events:
        UpdateCart:
          Type: Api
          Properties:
            RestApiId: !Ref CartApi
            Path: /cart/{product_id}
            Method: put

  CheckoutCartFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: shopping-cart-service/
      Handler: checkout_cart.lambda_handler
      Layers: [!Ref UtilsLayer]
      Policies: *DatabasePolicies
      Events:
        CheckoutCart:
          Type: Api
          Properties:
            RestApiId: !Ref CartApi
            Path: /cart/checkout
            Method: post

  GetCartTotalFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: shopping-cart-service/
      Handler: get_cart_total.lambda_handler
      Layers: [!Ref UtilsLayer]
      Policies: *DatabasePolicies
      Events:
        GetCartTotal:
          Type: Api
          Properties:
            RestApiId: !Ref CartApi
            Path: /cart/{product_id}/total
            Method: get

  CartApiUrl:
    Type: AWS::SSM::Parameter
    Properties:
      Type: String
      Name: /serverless-shopping-cart-demo/shopping-cart/cart-api-url
      Value: !Sub https://${CartApi}.execute-api.${AWS::Region}.amazonaws.com/Prod

Outputs:
  CartApi:
    Description: API Gateway endpoint URL for the MySQL cart service
    Value: !Sub https://${CartApi}.execute-api.${AWS::Region}.amazonaws.com/Prod
